<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Dashboard v9.18</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Fixed Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="logo-text">
                    <h1>Georgia Dashboard</h1>
                    <span class="version">v9.18</span>
                </div>
            </div>
            
            <div class="header-controls">
                <!-- Time Period Filter -->
                <div class="time-filter">
                    <select id="timePeriod" class="filter-select">
                        <option value="today">Today</option>
                        <option value="7d">Last 7 Days</option>
                        <option value="30d" selected>Last 30 Days</option>
                        <option value="MTD">Month to Date</option>
                        <option value="YTD">Year to Date</option>
                        <option value="custom">Custom Range</option>
                    </select>
                </div>
                
                <!-- Custom Date Range (Hidden by default) -->
                <div id="customDateRange" class="custom-date-range hidden">
                    <input type="date" id="startDate" class="date-input">
                    <span class="date-separator">to</span>
                    <input type="date" id="endDate" class="date-input">
                    <button id="applyCustomRange" class="btn-apply">Apply</button>
                </div>
                
                <!-- Status Indicator -->
                <div class="status-indicator" id="systemStatus">
                    <i class="fas fa-circle status-dot"></i>
                    <span class="status-text">Loading...</span>
                </div>
                
                <!-- Refresh Button -->
                <button class="refresh-btn" id="refreshBtn" title="Refresh Data">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-navigation">
        <div class="tab-nav-content">
            <button class="tab-btn active" data-tab="overview">
                <i class="fas fa-tachometer-alt"></i>
                <span>Overview</span>
            </button>
            <button class="tab-btn" data-tab="ar">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>AR Management</span>
            </button>
            <button class="tab-btn" data-tab="customers">
                <i class="fas fa-users"></i>
                <span>Customers</span>
            </button>
            <button class="tab-btn" data-tab="ai">
                <i class="fas fa-robot"></i>
                <span>AI Assistant</span>
            </button>
            <button class="tab-btn" data-tab="analytics">
                <i class="fas fa-chart-bar"></i>
                <span>Analytics</span>
            </button>
            <button class="tab-btn" data-tab="inventory">
                <i class="fas fa-boxes"></i>
                <span>Inventory</span>
            </button>
            <button class="tab-btn" data-tab="suppliers">
                <i class="fas fa-truck"></i>
                <span>Suppliers</span>
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="content-container">
            <!-- Dynamic content will be loaded here -->
            <div id="tabContent" class="tab-content">
                <!-- Overview Tab (Default) -->
                <div class="tab-panel active" id="overview-panel">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Loading Overview...</span>
                    </div>
                </div>
                
                <!-- AR Management Tab -->
                <div class="tab-panel" id="ar-panel">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Loading AR Management...</span>
                    </div>
                </div>
                
                <!-- Customers Tab -->
                <div class="tab-panel" id="customers-panel">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Loading Customer Ledger...</span>
                    </div>
                </div>
                
                <!-- AI Assistant Tab -->
                <div class="tab-panel" id="ai-panel">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Loading AI Assistant...</span>
                    </div>
                </div>
                
                <!-- Analytics Tab -->
                <div class="tab-panel" id="analytics-panel">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Loading Analytics...</span>
                    </div>
                </div>
                
                <!-- Inventory Tab -->
                <div class="tab-panel" id="inventory-panel">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Loading Inventory...</span>
                    </div>
                </div>
                
                <!-- Suppliers Tab -->
                <div class="tab-panel" id="suppliers-panel">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Loading Suppliers...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
