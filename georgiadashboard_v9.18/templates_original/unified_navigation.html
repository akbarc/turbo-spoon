<!-- Unified Navigation Component - Georgia Dashboard -->
<style>
    /* Reset for navigation consistency */
    .unified-nav * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* Fixed Left Sidebar - Always Visible */
    .unified-nav {
        width: 260px;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        box-shadow: 2px 0 15px rgba(0, 0, 0, 0.08);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Logo Section */
    .unified-nav-header {
        padding: 1.5rem;
        border-bottom: 2px solid #e5e7eb;
        background: white;
    }

    .unified-nav-logo {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        text-decoration: none;
    }

    .unified-nav-logo-icon {
        width: 45px;
        height: 45px;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.25rem;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .unified-nav-logo-text h1 {
        font-size: 1.125rem;
        font-weight: 700;
        color: #1f2937;
        line-height: 1.2;
    }

    .unified-nav-logo-text p {
        font-size: 0.75rem;
        color: #6b7280;
        font-weight: 500;
    }

    /* Navigation Items */
    .unified-nav-menu {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 0.75rem;
    }

    .unified-nav-section {
        margin-bottom: 1.5rem;
    }

    .unified-nav-section-title {
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #9ca3af;
        padding: 0.5rem 1rem;
        margin-bottom: 0.25rem;
    }

    .unified-nav-item {
        display: flex;
        align-items: center;
        padding: 0.625rem 1rem;
        margin: 0.125rem 0.25rem;
        border-radius: 8px;
        color: #4b5563;
        text-decoration: none;
        transition: all 0.15s ease;
        font-size: 0.875rem;
        font-weight: 500;
        position: relative;
    }

    .unified-nav-item:hover {
        background: #f3f4f6;
        color: #1f2937;
        transform: translateX(2px);
    }

    .unified-nav-item.active {
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: white;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
    }

    .unified-nav-item.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 20px;
        background: white;
        border-radius: 0 2px 2px 0;
    }

    .unified-nav-icon {
        min-width: 20px;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 0.75rem;
        font-size: 0.875rem;
    }

    .unified-nav-text {
        flex: 1;
        white-space: nowrap;
    }

    .unified-nav-badge {
        padding: 0.125rem 0.375rem;
        background: #ef4444;
        color: white;
        border-radius: 10px;
        font-size: 0.625rem;
        font-weight: 700;
        margin-left: auto;
    }

    /* Footer */
    .unified-nav-footer {
        padding: 1rem;
        border-top: 2px solid #e5e7eb;
        background: white;
    }

    .unified-nav-user {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem;
        border-radius: 8px;
        transition: background 0.15s;
    }

    .unified-nav-user:hover {
        background: #f9fafb;
    }

    .unified-nav-avatar {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 0.875rem;
    }

    .unified-nav-user-info {
        flex: 1;
    }

    .unified-nav-user-name {
        font-size: 0.8125rem;
        font-weight: 600;
        color: #1f2937;
        line-height: 1.2;
    }

    .unified-nav-user-role {
        font-size: 0.6875rem;
        color: #6b7280;
    }

    /* Main Content Area - Adjusted for Sidebar */
    .unified-main-content {
        margin-left: 260px;
        min-height: 100vh;
        background: #f9fafb;
        position: relative;
    }

    /* Mobile Menu Toggle */
    .unified-nav-toggle {
        display: none;
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 10001;
        width: 40px;
        height: 40px;
        background: white;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
        .unified-nav {
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .unified-nav.mobile-open {
            transform: translateX(0);
        }

        .unified-main-content {
            margin-left: 0;
        }

        .unified-nav-toggle {
            display: flex;
        }

        /* Overlay */
        .unified-nav-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9998;
        }

        .unified-nav-overlay.active {
            display: block;
        }
    }

    /* Scrollbar Styling */
    .unified-nav-menu::-webkit-scrollbar {
        width: 4px;
    }

    .unified-nav-menu::-webkit-scrollbar-track {
        background: transparent;
    }

    .unified-nav-menu::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 2px;
    }

    .unified-nav-menu:hover::-webkit-scrollbar-thumb {
        background: #9ca3af;
    }
</style>

<!-- Navigation Sidebar -->
<nav class="unified-nav" id="unifiedNav">
    <!-- Header/Logo -->
    <div class="unified-nav-header">
        <a href="/" class="unified-nav-logo">
            <div class="unified-nav-logo-icon">
                <i class="fas fa-chart-line"></i>
            </div>
            <div class="unified-nav-logo-text">
                <h1>Georgia Dashboard</h1>
                <p>Business Analytics</p>
            </div>
        </a>
    </div>

    <!-- Navigation Menu -->
    <div class="unified-nav-menu">
        <!-- Main Section -->
        <div class="unified-nav-section">
            <div class="unified-nav-section-title">Main</div>
            
            <a href="/" class="unified-nav-item" id="nav-home">
                <i class="fas fa-home unified-nav-icon"></i>
                <span class="unified-nav-text">Dashboard</span>
            </a>
            
            <a href="/ai-assistant" class="unified-nav-item" id="nav-ai">
                <i class="fas fa-robot unified-nav-icon"></i>
                <span class="unified-nav-text">AI Assistant</span>
            </a>
        </div>

        <!-- Operations Section -->
        <div class="unified-nav-section">
            <div class="unified-nav-section-title">Operations</div>
            
            <a href="/sales-ops" class="unified-nav-item" id="nav-sales">
                <i class="fas fa-cash-register unified-nav-icon"></i>
                <span class="unified-nav-text">Sales Operations</span>
            </a>
            
            <a href="/ar-dashboard" class="unified-nav-item" id="nav-ar">
                <i class="fas fa-file-invoice-dollar unified-nav-icon"></i>
                <span class="unified-nav-text">AR Dashboard</span>
            </a>
            
            <a href="/customer-ledger" class="unified-nav-item" id="nav-ledger">
                <i class="fas fa-users unified-nav-icon"></i>
                <span class="unified-nav-text">Customer Ledger</span>
            </a>
            
            <a href="/suppliers" class="unified-nav-item" id="nav-suppliers">
                <i class="fas fa-truck unified-nav-icon"></i>
                <span class="unified-nav-text">Suppliers</span>
            </a>
        </div>

        <!-- Analytics Section -->
        <div class="unified-nav-section">
            <div class="unified-nav-section-title">Analytics</div>
            
            <a href="/gp-analysis" class="unified-nav-item" id="nav-gp">
                <i class="fas fa-percentage unified-nav-icon"></i>
                <span class="unified-nav-text">GP Analysis</span>
            </a>
            
            <a href="/wholesale-retail" class="unified-nav-item" id="nav-wholesale">
                <i class="fas fa-store unified-nav-icon"></i>
                <span class="unified-nav-text">Wholesale/Retail</span>
            </a>
            
            <a href="/inventory" class="unified-nav-item" id="nav-inventory">
                <i class="fas fa-boxes unified-nav-icon"></i>
                <span class="unified-nav-text">Inventory</span>
            </a>
        </div>

        <!-- Reports Section -->
        <div class="unified-nav-section">
            <div class="unified-nav-section-title">Reports</div>
            
            <a href="/msa-reporting" class="unified-nav-item" id="nav-msa">
                <i class="fas fa-file-contract unified-nav-icon"></i>
                <span class="unified-nav-text">MSA Reporting</span>
            </a>
            
            <a href="/reports" class="unified-nav-item" id="nav-reports">
                <i class="fas fa-chart-bar unified-nav-icon"></i>
                <span class="unified-nav-text">Reports</span>
            </a>
        </div>
    </div>

    <!-- Footer/User -->
    <div class="unified-nav-footer">
        <div class="unified-nav-user">
            <div class="unified-nav-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="unified-nav-user-info">
                <div class="unified-nav-user-name">Store Admin</div>
                <div class="unified-nav-user-role">Administrator</div>
            </div>
        </div>
    </div>
</nav>

<!-- Mobile Menu Toggle -->
<button class="unified-nav-toggle" id="unifiedNavToggle" onclick="toggleUnifiedNav()">
    <i class="fas fa-bars"></i>
</button>

<!-- Mobile Overlay -->
<div class="unified-nav-overlay" id="unifiedNavOverlay" onclick="closeUnifiedNav()"></div>

<script>
    // Set active navigation item based on current path
    (function() {
        const currentPath = window.location.pathname;
        const navItems = document.querySelectorAll('.unified-nav-item');
        
        // Remove all active classes
        navItems.forEach(item => item.classList.remove('active'));
        
        // Set active based on current path
        if (currentPath === '/' || currentPath === '') {
            document.getElementById('nav-home')?.classList.add('active');
        } else if (currentPath === '/ai-assistant') {
            document.getElementById('nav-ai')?.classList.add('active');
        } else if (currentPath === '/sales-ops') {
            document.getElementById('nav-sales')?.classList.add('active');
        } else if (currentPath === '/ar-dashboard') {
            document.getElementById('nav-ar')?.classList.add('active');
        } else if (currentPath === '/customer-ledger') {
            document.getElementById('nav-ledger')?.classList.add('active');
        } else if (currentPath === '/suppliers') {
            document.getElementById('nav-suppliers')?.classList.add('active');
        } else if (currentPath === '/gp-analysis') {
            document.getElementById('nav-gp')?.classList.add('active');
        } else if (currentPath.includes('/wholesale')) {
            document.getElementById('nav-wholesale')?.classList.add('active');
        } else if (currentPath === '/inventory') {
            document.getElementById('nav-inventory')?.classList.add('active');
        } else if (currentPath.includes('/msa')) {
            document.getElementById('nav-msa')?.classList.add('active');
        } else if (currentPath.includes('/report')) {
            document.getElementById('nav-reports')?.classList.add('active');
        }
    })();

    // Mobile navigation functions
    function toggleUnifiedNav() {
        const nav = document.getElementById('unifiedNav');
        const overlay = document.getElementById('unifiedNavOverlay');
        
        nav.classList.toggle('mobile-open');
        overlay.classList.toggle('active');
    }

    function closeUnifiedNav() {
        const nav = document.getElementById('unifiedNav');
        const overlay = document.getElementById('unifiedNavOverlay');
        
        nav.classList.remove('mobile-open');
        overlay.classList.remove('active');
    }

    // Close mobile menu on escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeUnifiedNav();
        }
    });
</script>
